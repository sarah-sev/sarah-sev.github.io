{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<style>
  body { font-family: "Times", sans-serif; }
  h1, h2, h3, h4, h5, h6,
  .author__name,
  .author__bio,
  .btn,
  .masthead,
  .masthead *,
  .greedy-nav,
  .greedy-nav *,
  .masthead__menu-item,
  .masthead__menu-item a,
  .nav-text,
  .archive__item-title,
  input, button, textarea { font-family: inherit; }
  .list__item .archive__item,
  .archive__item {
  border: 1px solid #446179;
  border-radius: 6px;
  padding: 1em 1.25em;
  margin-bottom: 1.25em;
  background: #fff;
  }

  .page__title {
  font-size: larger;
  }

  .archive__item:hover {
  border-color: #446179;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  }
  .archive__item-title {
  margin-top: 0;
  color: #446179;
  }
  .archive__item-title a:visited {
  color: #446179 !important;
  }
  .archive__item {
  position: relative;
  cursor: pointer;
}

.archive__item-title a,
.archive__item-title a:visited,
.archive__item-title a:hover {
  color: inherit !important;
  text-decoration: none !important;
}

.archive__item-title a::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 1;
}

.archive__item-teaser a,
.archive__item-excerpt a {
  position: relative;
  z-index: 2;
}

.page-banner img {
  width: 100%;
  height: 330px;
  object-fit: cover;
  border-radius: 0px;
  margin-bottom: 1.5em;
}

.banner-overlay { position: relative; }
.banner-overlay h1 {
  position: absolute;
  bottom: 10.5em;
  left: 10.75em;
  margin: 0;
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,0.6);
}
</style>
